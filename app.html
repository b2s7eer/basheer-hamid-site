<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>basheer hamid — Computer Applications</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
        <style>
            :root {
                --bg: #101112;
                --bg-deep: #0b0c0d;
                --surface: #1a1b1d;
                --surface-2: #1e2021;
                --border: #2b2d2f;
                --border-soft: #232527;
                --cyan: #00ffcc;
                --green: #00b38f;
                --cyan-dim: rgba(0,255,204,.14);
                --green-dim: rgba(0,179,143,.16);
                --text: #eef0ef;
                --muted: #9aa0a0;
                --muted-2: #6d7373;
                --danger: #ff5c72;
                --danger-dim: rgba(255,92,114,.14);
                --radius-s: 6px;
                --radius: 12px;
                --radius-l: 20px;
                --font-en: 'Sora',sans-serif;
                --font-ar: 'Tajawal',sans-serif;
                --font-mono: 'JetBrains Mono',monospace;
                --font-ui: var(--font-en);
                --shadow-glow: 0 0 40px rgba(0,255,204,.06);
            }

            [dir="rtl"] {
                --font-ui: var(--font-ar);
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html {
                scroll-behavior: smooth;
            }

            body {
                background: radial-gradient(circle at 12% 8%, rgba(0,255,204,.05), transparent 42%), radial-gradient(circle at 88% 92%, rgba(0,179,143,.06), transparent 45%), var(--bg);
                color: var(--text);
                font-family: var(--font-ui);
                min-height: 100vh;
                line-height: 1.55;
                -webkit-font-smoothing: antialiased;
            }

            @media (prefers-reduced-motion:reduce) {
                * {
                    animation-duration: .01ms !important;
                    transition-duration: .01ms !important;
                }
            }

            /* ---------- utility ---------- */
            .hidden {
                display: none !important;
            }

            button {
                font-family: inherit;
                cursor: pointer;
                border: none;
                background: none;
                color: inherit;
            }

            a {
                color: inherit;
            }

            ::selection {
                background: var(--cyan-dim);
                color: var(--cyan);
            }

            ::-webkit-scrollbar {
                width: 10px;
                height: 10px;
            }

            ::-webkit-scrollbar-track {
                background: var(--bg-deep);
            }

            ::-webkit-scrollbar-thumb {
                background: var(--border);
                border-radius: 8px;
            }

            ::-webkit-scrollbar-thumb:hover {
                background: var(--muted-2);
            }

            /* ---------- splash ---------- */
            #splash {
                position: fixed;
                inset: 0;
                z-index: 200;
                display: flex;
                align-items: center;
                justify-content: center;
                background: radial-gradient(circle at 50% 30%, #15171a, var(--bg-deep) 70%);
                padding: 24px;
            }

            .splash-card {
                width: 100%;
                max-width: 460px;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--radius-l);
                padding: 44px 34px;
                text-align: center;
                box-shadow: var(--shadow-glow), 0 30px 60px rgba(0,0,0,.5);
                animation: rise .6s cubic-bezier(.2,.9,.3,1);
            }

            @keyframes rise {
                from {
                    opacity: 0;
                    transform: translateY(18px) scale(.98);
                }

                to {
                    opacity: 1;
                    transform: none;
                }
            }

            .splash-mark {
                font-family: var(--font-mono);
                font-size: 13px;
                letter-spacing: .16em;
                color: var(--cyan);
                margin-bottom: 6px;
            }

            .splash-title {
                font-size: 30px;
                font-weight: 800;
                background: linear-gradient(120deg,var(--cyan),var(--green));
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
                margin-bottom: 10px;
            }

            .splash-sub {
                color: var(--muted);
                font-size: 14.5px;
                margin-bottom: 32px;
            }

            .lang-choices {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .lang-btn {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 16px 20px;
                border: 1px solid var(--border);
                border-radius: var(--radius);
                background: var(--surface-2);
                transition: .2s;
                text-align: left;
            }

            .lang-btn:hover {
                border-color: var(--cyan);
                box-shadow: 0 0 0 1px var(--cyan) inset;
                transform: translateY(-1px);
            }

            .lang-btn .lb-title {
                font-weight: 700;
                font-size: 16px;
            }

            .lang-btn .lb-sub {
                color: var(--muted-2);
                font-size: 12.5px;
                margin-top: 2px;
            }

            .lang-btn .lb-arrow {
                color: var(--cyan);
                font-size: 18px;
            }

            /* ---------- app shell ---------- */
            #app {
                opacity: 0;
                transition: opacity .4s;
            }

            #app.ready {
                opacity: 1;
            }

            header {
                position: sticky;
                top: 0;
                z-index: 60;
                background: rgba(16,17,18,.86);
                backdrop-filter: blur(14px);
                border-bottom: 1px solid var(--border-soft);
            }

            .header-inner {
                max-width: 1180px;
                margin: 0 auto;
                display: flex;
                align-items: center;
                gap: 18px;
                padding: 14px 22px;
            }

            .brand {
                display: flex;
                align-items: center;
                gap: 10px;
                flex-shrink: 0;
            }

            .brand-mark {
                width: 38px;
                height: 38px;
                border-radius: 10px;
                background: linear-gradient(135deg,var(--cyan),var(--green));
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: var(--font-mono);
                font-weight: 700;
                color: #08130f;
                font-size: 15px;
            }

            .brand-name {
                font-weight: 800;
                font-size: 17px;
                letter-spacing: .01em;
            }

            .brand-name sup {
                color: var(--cyan);
                font-size: 11px;
            }

            .brand-tag {
                font-size: 10.5px;
                color: var(--muted-2);
                font-family: var(--font-mono);
                letter-spacing: .08em;
                margin-top: 1px;
            }

            nav.main-nav {
                display: flex;
                gap: 4px;
                flex: 1;
                overflow-x: auto;
                scrollbar-width: none;
            }

            nav.main-nav::-webkit-scrollbar {
                display: none;
            }

            .nav-btn {
                flex-shrink: 0;
                padding: 9px 15px;
                border-radius: 999px;
                font-size: 13.5px;
                font-weight: 600;
                color: var(--muted);
                white-space: nowrap;
                transition: .18s;
                border: 1px solid transparent;
            }

            .nav-btn:hover {
                color: var(--text);
            }

            .nav-btn.active {
                color: var(--bg-deep);
                background: linear-gradient(120deg,var(--cyan),var(--green));
            }

            .header-actions {
                display: flex;
                align-items: center;
                gap: 10px;
                flex-shrink: 0;
            }

            #langToggle {
                display: flex;
                border: 1px solid var(--border);
                border-radius: 999px;
                overflow: hidden;
                font-size: 12.5px;
                font-weight: 700;
            }

            #langToggle button {
                padding: 8px 13px;
                color: var(--muted);
                transition: .15s;
            }

            #langToggle button.active {
                background: var(--cyan-dim);
                color: var(--cyan);
            }

            main {
                max-width: 1180px;
                margin: 0 auto;
                padding: 30px 22px 90px;
            }

            /* ---------- hero / module head ---------- */
            .module-hero {
                border: 1px solid var(--border);
                border-radius: var(--radius-l);
                padding: 30px 28px;
                margin-bottom: 22px;
                background: linear-gradient(160deg,var(--surface),var(--surface-2));
                position: relative;
                overflow: hidden;
            }

            .module-hero::after {
                content: "";
                position: absolute;
                inset: 0;
                pointer-events: none;
                background: radial-gradient(circle at 90% 0%, rgba(0,255,204,.08), transparent 55%);
            }

            .module-eyebrow {
                font-family: var(--font-mono);
                font-size: 12px;
                color: var(--green);
                letter-spacing: .05em;
                margin-bottom: 8px;
            }

            .module-title {
                font-size: 26px;
                font-weight: 800;
                margin-bottom: 8px;
            }

            .module-desc {
                color: var(--muted);
                font-size: 14.5px;
                max-width: 680px;
            }

            .subtabs {
                display: flex;
                gap: 8px;
                margin-bottom: 20px;
                flex-wrap: wrap;
            }

            .subtab-btn {
                padding: 9px 16px;
                border-radius: var(--radius-s);
                font-size: 13.5px;
                font-weight: 700;
                border: 1px solid var(--border);
                color: var(--muted);
                background: var(--surface);
                transition: .18s;
            }

            .subtab-btn:hover {
                color: var(--text);
                border-color: var(--muted-2);
            }

            .subtab-btn.active {
                color: var(--cyan);
                border-color: var(--cyan);
                background: var(--cyan-dim);
            }

            .pane {
                display: none;
                animation: fadein .35s ease;
            }

            .pane.active {
                display: block;
            }

            @keyframes fadein {
                from {
                    opacity: 0;
                    transform: translateY(6px);
                }

                to {
                    opacity: 1;
                    transform: none;
                }
            }

            /* ---------- summary cards ---------- */
            .summary-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill,minmax(300px,1fr));
                gap: 14px;
            }

            .sum-card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 18px;
                transition: .2s;
            }

            .sum-card:hover {
                border-color: var(--muted-2);
            }

            .sum-num {
                font-family: var(--font-mono);
                color: var(--cyan);
                font-size: 12px;
                margin-bottom: 8px;
            }

            .sum-head {
                font-weight: 700;
                font-size: 15px;
                margin-bottom: 6px;
            }

            .sum-body {
                color: var(--muted);
                font-size: 13.5px;
            }

            .sum-body code, .formula {
                font-family: var(--font-mono);
                background: var(--bg-deep);
                border: 1px solid var(--border-soft);
                color: var(--green);
                padding: 2px 7px;
                border-radius: 5px;
                font-size: 12.5px;
                display: inline-block;
                margin-top: 6px;
            }

            /* ---------- practical / simulation ---------- */
            .task-card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 20px;
                margin-bottom: 16px;
            }

            .task-head {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 10px;
            }

            .task-badge {
                font-family: var(--font-mono);
                font-size: 11px;
                padding: 3px 9px;
                border-radius: 999px;
                background: var(--green-dim);
                color: var(--green);
                font-weight: 600;
            }

            .task-title {
                font-weight: 700;
                font-size: 15.5px;
            }

            .task-scenario {
                color: var(--muted);
                font-size: 13.5px;
                margin-bottom: 14px;
            }

            .grid-table {
                border-collapse: collapse;
                margin: 12px 0;
                font-size: 13px;
                font-family: var(--font-mono);
                width: 100%;
                max-width: 480px;
                overflow-x: auto;
                display: block;
            }

            .grid-table td,.grid-table th {
                border: 1px solid var(--border);
                padding: 7px 10px;
                text-align: center;
                white-space: nowrap;
            }

            .grid-table th {
                background: var(--bg-deep);
                color: var(--cyan);
            }

            .grid-table td.cellref {
                background: var(--bg-deep);
                color: var(--muted-2);
            }

            .opt-list {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .opt-btn {
                text-align: left;
                padding: 11px 14px;
                border: 1px solid var(--border);
                border-radius: var(--radius-s);
                font-family: var(--font-mono);
                font-size: 13px;
                background: var(--surface-2);
                transition: .15s;
            }

            [dir="rtl"] .opt-btn {
                text-align: right;
                font-family: var(--font-ar);
            }

            .opt-btn:hover {
                border-color: var(--cyan);
            }

            .opt-btn.correct {
                border-color: var(--green);
                background: var(--green-dim);
                color: var(--green);
            }

            .opt-btn.wrong {
                border-color: var(--danger);
                background: var(--danger-dim);
                color: var(--danger);
            }

            .opt-btn:disabled {
                cursor: default;
            }

            .order-list {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .order-item {
                padding: 11px 14px;
                border: 1px solid var(--border);
                border-radius: var(--radius-s);
                background: var(--surface-2);
                font-size: 13.5px;
                display: flex;
                align-items: center;
                gap: 10px;
                transition: .15s;
            }

            .order-item:hover {
                border-color: var(--muted-2);
            }

            .order-item .oi-idx {
                font-family: var(--font-mono);
                color: var(--muted-2);
                font-size: 12px;
                min-width: 18px;
            }

            .order-item.picked {
                border-color: var(--cyan);
                color: var(--cyan);
            }

            .order-item.correct-pos {
                border-color: var(--green);
                background: var(--green-dim);
            }

            .order-item.wrong-pos {
                border-color: var(--danger);
                background: var(--danger-dim);
            }

            .match-row {
                display: flex;
                align-items: center;
                gap: 12px;
                margin-bottom: 9px;
                flex-wrap: wrap;
            }

            .match-left {
                font-size: 13.5px;
                min-width: 180px;
                color: var(--text);
            }

            .match-row select {
                background: var(--surface-2);
                color: var(--text);
                border: 1px solid var(--border);
                border-radius: var(--radius-s);
                padding: 8px 10px;
                font-family: inherit;
                font-size: 13px;
                flex: 1;
                min-width: 160px;
            }

            .match-row.correct select {
                border-color: var(--green);
                color: var(--green);
            }

            .match-row.wrong select {
                border-color: var(--danger);
                color: var(--danger);
            }

            .task-actions {
                display: flex;
                gap: 10px;
                margin-top: 14px;
                align-items: center;
                flex-wrap: wrap;
            }

            .btn {
                padding: 10px 18px;
                border-radius: 999px;
                font-weight: 700;
                font-size: 13.5px;
                transition: .18s;
            }

            .btn-primary {
                background: linear-gradient(120deg,var(--cyan),var(--green));
                color: #08130f;
            }

            .btn-primary:hover {
                filter: brightness(1.08);
                transform: translateY(-1px);
            }

            .btn-primary:disabled {
                opacity: .4;
                cursor: not-allowed;
                transform: none;
            }

            .btn-ghost {
                border: 1px solid var(--border);
                color: var(--muted);
            }

            .btn-ghost:hover {
                color: var(--text);
                border-color: var(--muted-2);
            }

            .task-feedback {
                font-size: 13px;
                margin-top: 10px;
                font-weight: 600;
            }

            .task-feedback.ok {
                color: var(--green);
            }

            .task-feedback.no {
                color: var(--danger);
            }

            /* ---------- quiz ---------- */
            .quiz-intro {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--radius-l);
                padding: 30px;
                text-align: center;
            }

            .quiz-intro .qi-num {
                font-size: 44px;
                font-weight: 800;
                color: var(--cyan);
                font-family: var(--font-mono);
            }

            .quiz-intro p {
                color: var(--muted);
                margin: 10px 0 22px;
                font-size: 14px;
            }

            .quiz-wrap {
                display: none;
            }

            .quiz-wrap.active {
                display: block;
            }

            .quiz-progress {
                height: 5px;
                background: var(--border);
                border-radius: 4px;
                overflow: hidden;
                margin-bottom: 22px;
            }

            .quiz-progress-bar {
                height: 100%;
                background: linear-gradient(90deg,var(--cyan),var(--green));
                transition: width .3s;
            }

            .quiz-meta {
                display: flex;
                justify-content: space-between;
                color: var(--muted-2);
                font-size: 12.5px;
                font-family: var(--font-mono);
                margin-bottom: 14px;
            }

            .quiz-q-card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 24px;
                margin-bottom: 16px;
            }

            .quiz-q-text {
                font-size: 16px;
                font-weight: 700;
                margin-bottom: 16px;
            }

            .quiz-options {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .quiz-nav {
                display: flex;
                justify-content: space-between;
                margin-top: 6px;
            }

            .qn-dots {
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
                margin: 18px 0;
            }

            .qn-dot {
                width: 26px;
                height: 26px;
                border-radius: 7px;
                border: 1px solid var(--border);
                font-size: 11px;
                font-family: var(--font-mono);
                color: var(--muted);
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .qn-dot.answered {
                border-color: var(--cyan);
                color: var(--cyan);
            }

            .qn-dot.current {
                background: var(--cyan);
                color: var(--bg-deep);
                border-color: var(--cyan);
            }

            .quiz-results {
                display: none;
                text-align: center;
            }

            .quiz-results.active {
                display: block;
            }

            .result-ring {
                width: 150px;
                height: 150px;
                border-radius: 50%;
                margin: 0 auto 18px;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: column;
                border: 6px solid var(--border);
                position: relative;
            }

            .result-ring .rr-pct {
                font-size: 30px;
                font-weight: 800;
                font-family: var(--font-mono);
            }

            .result-ring .rr-lbl {
                font-size: 11px;
                color: var(--muted-2);
            }

            .result-quote {
                font-size: 15px;
                font-style: italic;
                color: var(--cyan);
                margin: 18px auto;
                max-width: 520px;
                border-left: 3px solid var(--cyan);
                padding: 4px 0 4px 14px;
                text-align: left;
            }

            [dir="rtl"] .result-quote {
                border-left: none;
                border-right: 3px solid var(--cyan);
                padding: 4px 14px 4px 0;
                text-align: right;
            }

            .review-list {
                text-align: left;
                margin-top: 26px;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            [dir="rtl"] .review-list {
                text-align: right;
            }

            .review-item {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--radius-s);
                padding: 14px;
                font-size: 13px;
            }

            .review-item .ri-q {
                font-weight: 700;
                margin-bottom: 8px;
            }

            .review-item .ri-a {
                color: var(--muted);
                margin-bottom: 3px;
            }

            .review-item .ri-a.right {
                color: var(--green);
            }

            .review-item .ri-a.wrong {
                color: var(--danger);
            }

            /* ---------- glossary ---------- */
            .glossary-search {
                width: 100%;
                padding: 13px 16px;
                border-radius: var(--radius);
                border: 1px solid var(--border);
                background: var(--surface);
                color: var(--text);
                font-family: inherit;
                font-size: 14px;
                margin-bottom: 18px;
            }

            .gloss-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill,minmax(280px,1fr));
                gap: 12px;
            }

            .gloss-card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 16px;
            }

            .gloss-term {
                font-weight: 700;
                color: var(--cyan);
                font-family: var(--font-mono);
                font-size: 13.5px;
                margin-bottom: 6px;
            }

            .gloss-def {
                color: var(--muted);
                font-size: 13px;
            }

            footer {
                border-top: 1px solid var(--border-soft);
                padding: 26px 22px;
                text-align: center;
                color: var(--muted-2);
                font-size: 12px;
            }

            @media (max-width: 720px) {
                .header-inner {
                    flex-wrap:wrap;
                }

                nav.main-nav {
                    order: 3;
                    width: 100%;
                    padding-top: 8px;
                    border-top: 1px solid var(--border-soft);
                    margin-top: 8px;
                }

                .module-title {
                    font-size: 21px;
                }

                .quiz-q-text {
                    font-size: 14.5px;
                }
            }
        </style>
    </head>
    <body>
        <!-- ================= SPLASH ================= -->
        <div id="splash">
            <div class="splash-card">
                <div class="splash-mark">basheer hamid</div>
                <div class="splash-title">Computer Applications</div>
                <div class="splash-sub">Select your language to begin · اختر لغتك للبدء</div>
                <div class="lang-choices">
                    <button class="lang-btn" data-lang="en">
                        <div>
                            <div class="lb-title">English</div>
                            <div class="lb-sub">Continue in English</div>
                        </div>
                        <span class="lb-arrow">→</span>
                    </button>
                    <button class="lang-btn" data-lang="ar">
                        <div>
                            <div class="lb-title">العربية</div>
                            <div class="lb-sub">المتابعة باللغة العربية</div>
                        </div>
                        <span class="lb-arrow">→</span>
                    </button>
                </div>
            </div>
        </div>
        <!-- ================= APP ================= -->
        <div id="app">
            <header>
                <div class="header-inner">
                    <div class="brand">
                        <div class="brand-mark">BH</div>
                        <div>
                            <div class="brand-name" dir="ltr">
                                basheer hamid
                            </div>
                            <div class="brand-tag" id="brandTag" dir="ltr">COMPUTER APPLICATIONS</div>
                        </div>
                    </div>
                    <nav class="main-nav" id="mainNav"></nav>
                    <div class="header-actions">
                        <div id="langToggle">
                            <button data-lang="en">EN</button>
                            <button data-lang="ar">AR</button>
                        </div>
                    </div>
                </div>
            </header>
            <main id="mainContent"></main>
            <footer id="footerText"></footer>
        </div>
        <script>
            /* ============================================================
   basheer hamid — Computer Applications SPA
   Vanilla JS. No frameworks. All content grounded in the
   supplied "Computer Applications II" lab manual (Word / Excel /
   PowerPoint). Bilingual EN/AR with full state-preserving switch.
   ============================================================ */

            /* ---------------- UI STRING DICTIONARY ---------------- */
            const UI = {
                en: {
                    brandTag: "COMPUTER APPLICATIONS",
                    navWord: "Word",
                    navExcel: "Excel",
                    navPpt: "PowerPoint",
                    navGloss: "Glossary",
                    subSummary: "Summaries",
                    subPractical: "Practical Application",
                    subQuiz: "Theoretical Quiz",
                    wordTitle: "Microsoft Word",
                    wordDesc: "Document structure, styles, templates, long-document workflows, mail merge and academic citations.",
                    excelTitle: "Microsoft Excel",
                    excelDesc: "Logical functions, lookup functions, data validation, protection and PivotTables for real data-processing tasks.",
                    pptTitle: "Microsoft PowerPoint",
                    pptDesc: "Slide structure, transitions, animation systems, the Slide Master, media, and AI-assisted presentation building.",
                    glossTitle: "General Glossary",
                    glossDesc: "Every technical term used across the three modules, in one searchable place.",
                    glossSearch: "Search a term…",
                    startQuiz: "Start Quiz",
                    quizIntroLine: "20 random questions pulled from this module's question bank.",
                    quizIntroNum: "20",
                    questions: "Questions",
                    qLabel: "Question",
                    of: "of",
                    next: "Next",
                    prev: "Back",
                    submitQuiz: "Submit Quiz",
                    answerAll: "Answer every question to submit.",
                    yourScore: "Your Score",
                    retake: "Retake Quiz",
                    backSummaries: "Review Answers",
                    reviewTitle: "Answer Review",
                    correctLbl: "Correct answer",
                    yourAnswer: "Your answer",
                    taskCheck: "Check Answer",
                    taskReset: "Reset",
                    taskCorrect: "Correct — exactly right.",
                    taskWrong: "Not quite — review the highlighted answer.",
                    scenario: "Scenario",
                    practicalBadgeChoice: "Practical Scenario",
                    practicalBadgeOrder: "Sequence the Steps",
                    practicalBadgeMatch: "Match the Concept",
                    orderHint: "Click the steps below in the correct order.",
                    matchHint: "Choose the matching option for each item.",
                    footer: "basheer hamid — Computer Applications · Built from the course lab manual",
                    formula: "Formula",
                },
                ar: {
                    brandTag: "تطبيقات الحاسوب",
                    navWord: "وورد",
                    navExcel: "إكسل",
                    navPpt: "بوربوينت",
                    navGloss: "المسرد العام",
                    subSummary: "الملخصات",
                    subPractical: "التطبيق العملي",
                    subQuiz: "الاختبار النظري",
                    wordTitle: "مايكروسوفت وورد",
                    wordDesc: "بنية المستندات، الأنماط، القوالب، إدارة المستندات الطويلة، الدمج البريدي، والاستشهادات الأكاديمية.",
                    excelTitle: "مايكروسوفت إكسل",
                    excelDesc: "الدوال المنطقية، دوال البحث، التحقق من صحة البيانات، الحماية والجداول المحورية لمعالجة بيانات حقيقية.",
                    pptTitle: "مايكروسوفت بوربوينت",
                    pptDesc: "بنية الشرائح، الانتقالات، أنظمة الحركة، الشريحة الرئيسية، الوسائط، وبناء العروض بمساعدة الذكاء الاصطناعي.",
                    glossTitle: "المسرد العام",
                    glossDesc: "جميع المصطلحات التقنية المستخدمة عبر الوحدات الثلاث، في مكان واحد قابل للبحث.",
                    glossSearch: "ابحث عن مصطلح…",
                    startQuiz: "ابدأ الاختبار",
                    quizIntroLine: "٢٠ سؤالاً عشوائياً يتم سحبها من بنك أسئلة هذه الوحدة.",
                    quizIntroNum: "٢٠",
                    questions: "سؤال",
                    qLabel: "السؤال",
                    of: "من",
                    next: "التالي",
                    prev: "السابق",
                    submitQuiz: "إنهاء الاختبار",
                    answerAll: "أجب عن جميع الأسئلة لإنهاء الاختبار.",
                    yourScore: "نتيجتك",
                    retake: "إعادة الاختبار",
                    backSummaries: "مراجعة الإجابات",
                    reviewTitle: "مراجعة الإجابات",
                    correctLbl: "الإجابة الصحيحة",
                    yourAnswer: "إجابتك",
                    taskCheck: "تحقق من الإجابة",
                    taskReset: "إعادة التعيين",
                    taskCorrect: "إجابة صحيحة تماماً.",
                    taskWrong: "غير صحيحة — راجع الإجابة المظللة.",
                    scenario: "السيناريو",
                    practicalBadgeChoice: "سيناريو عملي",
                    practicalBadgeOrder: "رتّب الخطوات",
                    practicalBadgeMatch: "طابق المفهوم",
                    orderHint: "انقر على الخطوات أدناه بالترتيب الصحيح.",
                    matchHint: "اختر الخيار المطابق لكل عنصر.",
                    footer: "basheer hamid — تطبيقات الحاسوب · مبني من دليل مختبر المقرر",
                    formula: "الصيغة",
                },
            };

            /* Motivational, purely academic/tech-flavored quotes (bilingual pairs, index-aligned) */
            const QUOTES_EN = ["Code your way to success — one function at a time.", "Mastery is built on persistence, not perfection.", "Every formula you understand is a problem you'll never fear again.", "Great effort! Consistency compiles into expertise.", "Debug your weak points today, ship a stronger version of yourself tomorrow.", "Skilled hands with Office tools are never idle hands.", "Precision today, productivity for a lifetime.", ];
            const QUOTES_AR = ["استمر في التقدم، الاحتراف يبدأ بخطوة واحدة.", "الإتقان يُبنى بالمثابرة لا بالكمال المفاجئ.", "كل دالة تفهمها اليوم مشكلة لن تخشاها غداً.", "مجهود رائع! الاستمرارية تتحول مع الوقت إلى خبرة حقيقية.", "عالج نقاط ضعفك اليوم لتصدر نسخة أقوى من نفسك غداً.", "اليد الماهرة في أدوات أوفيس لا تعرف الكسل.", "الدقة اليوم إنتاجية تدوم العمر كله.", ];

            /* ---------------- STATE ---------------- */
            const state = {
                lang: null,
                module: 'excel',
                subtab: 'summary',
                quiz: {
                    module: null,
                    pool: [],
                    idx: 0,
                    answers: {},
                    submitted: false
                },
            };

            function t(key) {
                return UI[state.lang][key];
            }
            function pick(obj) {
                return state.lang === 'ar' ? obj.ar : obj.en;
            }

            /* Strict-syntax guard: any option/answer text that is (or contains) Excel
   formula syntax must render LTR + monospace, isolated from the surrounding
   RTL paragraph direction, so "=", commas and parentheses never re-order. */
            function safeFormula(txt) {
                if (typeof txt !== 'string')
                    return txt;
                if (/^=|^[A-Z]+\(.*\)$|\b(IF|AND|OR|NOT|VLOOKUP|HLOOKUP|MATCH|INDEX|XLOOKUP)\(/.test(txt)) {
                    return `<span dir="ltr" style="unicode-bidi:isolate;display:inline-block;font-family:var(--font-mono);">${txt}</span>`;
                }
                return txt;
            }

            /* ---------------- BOOT ---------------- */
            document.querySelectorAll('.lang-btn').forEach(b => {
                b.addEventListener('click', () => setLanguage(b.dataset.lang, true));
            }
            );
            document.querySelectorAll('#langToggle button').forEach(b => {
                b.addEventListener('click', () => setLanguage(b.dataset.lang, false));
            }
            );

            function setLanguage(lang, fromSplash) {
                state.lang = lang;
                document.documentElement.lang = lang;
                document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
                document.querySelectorAll('#langToggle button').forEach(b => {
                    b.classList.toggle('active', b.dataset.lang === lang);
                }
                );
                document.getElementById('brandTag').textContent = t('brandTag');
                document.getElementById('footerText').textContent = t('footer');
                buildNav();
                renderMain();
                if (fromSplash) {
                    document.getElementById('splash').style.display = 'none';
                    const app = document.getElementById('app');
                    app.classList.add('ready');
                }
            }

            function buildNav() {
                const nav = document.getElementById('mainNav');
                const items = [{
                    id: 'word',
                    label: t('navWord')
                }, {
                    id: 'excel',
                    label: t('navExcel')
                }, {
                    id: 'powerpoint',
                    label: t('navPpt')
                }, {
                    id: 'glossary',
                    label: t('navGloss')
                }, ];
                nav.innerHTML = items.map(i => `<button class="nav-btn ${state.module === i.id ? 'active' : ''}" data-mod="${i.id}">${i.label}</button>`).join('');
                nav.querySelectorAll('.nav-btn').forEach(b => {
                    b.addEventListener('click', () => {
                        state.module = b.dataset.mod;
                        state.subtab = 'summary';
                        state.quiz = {
                            module: null,
                            pool: [],
                            idx: 0,
                            answers: {},
                            submitted: false
                        };
                        buildNav();
                        renderMain();
                        window.scrollTo({
                            top: 0,
                            behavior: 'smooth'
                        });
                    }
                    );
                }
                );
            }

            /* ---------------- MAIN RENDER ---------------- */
            function renderMain() {
                const main = document.getElementById('mainContent');
                if (state.module === 'glossary') {
                    main.innerHTML = renderGlossary();
                    attachGlossary();
                    return;
                }

                const mod = MODULES[state.module];
                const heroTitleKey = state.module === 'word' ? 'wordTitle' : state.module === 'excel' ? 'excelTitle' : 'pptTitle';
                const heroDescKey = state.module === 'word' ? 'wordDesc' : state.module === 'excel' ? 'excelDesc' : 'pptDesc';

                main.innerHTML = `
    <div class="module-hero">
      <div class="module-eyebrow">MODULE · ${mod.eyebrow}</div>
      <div class="module-title">${t(heroTitleKey)}</div>
      <div class="module-desc">${t(heroDescKey)}</div>
    </div>
    <div class="subtabs">
      <button class="subtab-btn ${state.subtab === 'summary' ? 'active' : ''}" data-sub="summary">${t('subSummary')}</button>
      <button class="subtab-btn ${state.subtab === 'practical' ? 'active' : ''}" data-sub="practical">${t('subPractical')}</button>
      <button class="subtab-btn ${state.subtab === 'quiz' ? 'active' : ''}" data-sub="quiz">${t('subQuiz')}</button>
    </div>
    <div id="paneHolder"></div>
  `;
                main.querySelectorAll('.subtab-btn').forEach(b => {
                    b.addEventListener('click', () => {
                        state.subtab = b.dataset.sub;
                        if (state.subtab !== 'quiz') {
                            state.quiz = {
                                module: null,
                                pool: [],
                                idx: 0,
                                answers: {},
                                submitted: false
                            };
                        }
                        renderMain();
                    }
                    );
                }
                );
                renderPane(mod);
            }

            function renderPane(mod) {
                const holder = document.getElementById('paneHolder');
                if (state.subtab === 'summary')
                    holder.innerHTML = renderSummaries(mod);
                else if (state.subtab === 'practical') {
                    holder.innerHTML = renderTasksShell(mod);
                    attachTasks(mod);
                } else if (state.subtab === 'quiz') {
                    holder.innerHTML = renderQuizShell(mod);
                    attachQuiz(mod);
                }
            }

            /* ---------------- SUMMARIES ---------------- */
            function renderSummaries(mod) {
                return `<div class="summary-grid">` + mod.summaries.map( (s, i) => `
    <div class="sum-card">
      <div class="sum-num">${String(i + 1).padStart(2, '0')}</div>
      <div class="sum-head">${pick(s).h}</div>
      <div class="sum-body">${pick(s).body}</div>
      ${s.formula ? `<div style="font-size:11px;color:var(--muted-2);margin-top:12px;font-weight:700;letter-spacing:.04em;">${t('formula').toUpperCase()}</div><div dir="ltr" style="background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; font-family: monospace; color: #00ffcc; text-align: left; margin: 6px 0 0; font-size: 1.05rem; font-weight: bold; overflow-x:auto; unicode-bidi: isolate;">${s.formula}</div>` : ''}
    </div>`).join('') + `</div>`;
            }

            /* ---------------- GLOSSARY ---------------- */
            function renderGlossary() {
                return `
    <div class="module-hero">
      <div class="module-eyebrow">REFERENCE</div>
      <div class="module-title">${t('glossTitle')}</div>
      <div class="module-desc">${t('glossDesc')}</div>
    </div>
    <input class="glossary-search" id="glossSearch" placeholder="${t('glossSearch')}">
    <div class="gloss-grid" id="glossGrid"></div>
  `;
            }
            function attachGlossary() {
                const grid = document.getElementById('glossGrid');
                const input = document.getElementById('glossSearch');
                function draw(filter) {
                    const f = (filter || '').trim().toLowerCase();
                    const items = GLOSSARY.filter(g => {
                        if (!f)
                            return true;
                        return pick(g).term.toLowerCase().includes(f) || pick(g).def.toLowerCase().includes(f) || g.en.term.toLowerCase().includes(f);
                    }
                    );
                    grid.innerHTML = items.map(g => `
      <div class="gloss-card">
        <div class="gloss-term">${pick(g).term}</div>
        <div class="gloss-def">${pick(g).def}</div>
      </div>`).join('') || `<div style="color:var(--muted-2);padding:20px;">—</div>`;
                }
                draw('');
                input.addEventListener('input', () => draw(input.value));
            }

            /* ---------------- PRACTICAL TASKS ENGINE ---------------- */
            function renderTasksShell(mod) {
                return `<div id="tasksHolder">` + mod.tasks.map( (task, i) => renderTask(task, i)).join('') + `</div>`;
            }

            function renderTask(task, idx) {
                const badgeKey = task.type === 'choice' ? 'practicalBadgeChoice' : task.type === 'order' ? 'practicalBadgeOrder' : 'practicalBadgeMatch';
                let body = '';
                if (task.type === 'choice') {
                    body = `
      ${task.table ? renderGridTable(task.table) : ''}
      <div class="opt-list" data-tid="${idx}">
        ${pick(task.options).map( (o, oi) => `<button class="opt-btn" data-i="${oi}">${safeFormula(o)}</button>`).join('')}
      </div>
      <div class="task-actions">
        <button class="btn btn-ghost" data-reset="${idx}">${t('taskReset')}</button>
      </div>
      <div class="task-feedback" data-fb="${idx}"></div>
    `;
                } else if (task.type === 'order') {
                    body = `
      <div class="task-scenario" style="margin-bottom:8px;font-style:italic;">${t('orderHint')}</div>
      <div class="order-list" data-tid="${idx}"></div>
      <div class="task-actions">
        <button class="btn btn-primary" data-check="${idx}">${t('taskCheck')}</button>
        <button class="btn btn-ghost" data-reset="${idx}">${t('taskReset')}</button>
      </div>
      <div class="task-feedback" data-fb="${idx}"></div>
    `;
                } else if (task.type === 'match') {
                    body = `
      <div class="task-scenario" style="margin-bottom:8px;font-style:italic;">${t('matchHint')}</div>
      <div data-tid="${idx}"></div>
      <div class="task-actions">
        <button class="btn btn-primary" data-check="${idx}">${t('taskCheck')}</button>
        <button class="btn btn-ghost" data-reset="${idx}">${t('taskReset')}</button>
      </div>
      <div class="task-feedback" data-fb="${idx}"></div>
    `;
                }
                return `
    <div class="task-card" data-task="${idx}">
      <div class="task-head">
        <span class="task-badge">${t(badgeKey)}</span>
        <span class="task-title">${pick(task.title)}</span>
      </div>
      <div class="task-scenario">${pick(task.scenario)}</div>
      ${body}
    </div>
  `;
            }

            function renderGridTable(rows) {
                return `<table class="grid-table" dir="ltr" style="unicode-bidi:isolate;"><tbody>` + rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('') + `</tbody></table>`;
            }

            function attachTasks(mod) {
                mod.tasks.forEach( (task, idx) => {
                    if (task.type === 'choice')
                        attachChoiceTask(mod, task, idx);
                    else if (task.type === 'order')
                        attachOrderTask(mod, task, idx);
                    else if (task.type === 'match')
                        attachMatchTask(mod, task, idx);
                }
                );
            }

            function attachChoiceTask(mod, task, idx) {
                const card = document.querySelector(`.task-card[data-task="${idx}"]`);
                const btns = card.querySelectorAll('.opt-btn');
                const fb = card.querySelector(`[data-fb="${idx}"]`);
                btns.forEach( (b, oi) => {
                    b.addEventListener('click', () => {
                        btns.forEach(x => x.disabled = true);
                        if (oi === task.correct) {
                            b.classList.add('correct');
                            fb.textContent = t('taskCorrect');
                            fb.className = 'task-feedback ok';
                        } else {
                            b.classList.add('wrong');
                            btns[task.correct].classList.add('correct');
                            fb.textContent = t('taskWrong');
                            fb.className = 'task-feedback no';
                        }
                    }
                    );
                }
                );
                card.querySelector(`[data-reset="${idx}"]`).addEventListener('click', () => {
                    btns.forEach(b => {
                        b.disabled = false;
                        b.classList.remove('correct', 'wrong');
                    }
                    );
                    fb.textContent = '';
                    fb.className = 'task-feedback';
                }
                );
            }

            function attachOrderTask(mod, task, idx) {
                const card = document.querySelector(`.task-card[data-task="${idx}"]`);
                const list = card.querySelector(`.order-list[data-tid="${idx}"]`);
                const fb = card.querySelector(`[data-fb="${idx}"]`);
                const correctOrder = pick(task.items);
                let shuffled, picked;

                function build() {
                    shuffled = correctOrder.map( (txt, i) => ({
                        txt,
                        i
                    })).sort( () => Math.random() - 0.5);
                    picked = [];
                    draw();
                }
                function draw() {
                    list.innerHTML = shuffled.map(item => {
                        const seq = picked.indexOf(item.i);
                        return `<div class="order-item ${seq > -1 ? 'picked' : ''}" data-oi="${item.i}">
        <span class="oi-idx">${seq > -1 ? seq + 1 : '·'}</span><span>${item.txt}</span>
      </div>`;
                    }
                    ).join('');
                    list.querySelectorAll('.order-item').forEach(el => {
                        el.addEventListener('click', () => {
                            const oi = Number(el.dataset.oi);
                            if (picked.includes(oi))
                                picked = picked.filter(x => x !== oi);
                            else
                                picked.push(oi);
                            draw();
                        }
                        );
                    }
                    );
                }
                build();

                card.querySelector(`[data-check="${idx}"]`).addEventListener('click', () => {
                    if (picked.length !== correctOrder.length) {
                        fb.textContent = t('answerAll');
                        fb.className = 'task-feedback no';
                        return;
                    }
                    let allOk = true;
                    list.querySelectorAll('.order-item').forEach(el => {
                        const oi = Number(el.dataset.oi);
                        const seq = picked.indexOf(oi);
                        if (seq === oi) {
                            el.classList.add('correct-pos');
                        } else {
                            el.classList.add('wrong-pos');
                            allOk = false;
                        }
                    }
                    );
                    fb.textContent = allOk ? t('taskCorrect') : t('taskWrong');
                    fb.className = 'task-feedback ' + (allOk ? 'ok' : 'no');
                }
                );
                card.querySelector(`[data-reset="${idx}"]`).addEventListener('click', () => {
                    fb.textContent = '';
                    fb.className = 'task-feedback';
                    build();
                }
                );
            }

            function attachMatchTask(mod, task, idx) {
                const card = document.querySelector(`.task-card[data-task="${idx}"]`);
                const holder = card.querySelector(`[data-tid="${idx}"]`);
                const fb = card.querySelector(`[data-fb="${idx}"]`);
                const pairs = pick(task.pairs);
                const rightOptions = pairs.map( (p, i) => ({
                    i,
                    text: p.right
                }));

                function build() {
                    holder.innerHTML = pairs.map( (p, i) => {
                        const shuffledRight = [...rightOptions].sort( () => Math.random() - 0.5);
                        return `<div class="match-row" data-row="${i}">
        <div class="match-left">${p.left}</div>
        <select data-row-select="${i}">
          <option value="-1">···</option>
          ${shuffledRight.map(r => `<option value="${r.i}">${r.text}</option>`).join('')}
        </select>
      </div>`;
                    }
                    ).join('');
                }
                build();

                card.querySelector(`[data-check="${idx}"]`).addEventListener('click', () => {
                    let allOk = true
                      , allAnswered = true;
                    holder.querySelectorAll('.match-row').forEach(row => {
                        const ri = Number(row.dataset.row);
                        const sel = row.querySelector('select');
                        const val = Number(sel.value);
                        row.classList.remove('correct', 'wrong');
                        if (val === -1) {
                            allAnswered = false;
                            return;
                        }
                        if (val === ri)
                            row.classList.add('correct');
                        else {
                            row.classList.add('wrong');
                            allOk = false;
                        }
                    }
                    );
                    if (!allAnswered) {
                        fb.textContent = t('answerAll');
                        fb.className = 'task-feedback no';
                        return;
                    }
                    fb.textContent = allOk ? t('taskCorrect') : t('taskWrong');
                    fb.className = 'task-feedback ' + (allOk ? 'ok' : 'no');
                }
                );
                card.querySelector(`[data-reset="${idx}"]`).addEventListener('click', () => {
                    fb.textContent = '';
                    fb.className = 'task-feedback';
                    build();
                }
                );
            }

            /* ---------------- QUIZ ENGINE ---------------- */
            function shuffleArr(arr) {
                return [...arr].sort( () => Math.random() - 0.5);
            }

            function renderQuizShell(mod) {
                if (state.quiz.module !== state.module || !state.quiz.pool.length) {
                    const pool = shuffleArr(mod.questions).slice(0, 20);
                    state.quiz = {
                        module: state.module,
                        pool,
                        idx: 0,
                        answers: {},
                        submitted: false
                    };
                }
                return `
    <div class="quiz-intro" id="quizIntro" style="${state.quiz.started ? 'display:none;' : ''}">
      <div class="qi-num">${t('quizIntroNum')}</div>
      <div style="color:var(--muted);font-weight:700;margin-top:2px;">${t('questions')}</div>
      <p>${t('quizIntroLine')}</p>
      <button class="btn btn-primary" id="quizStartBtn">${t('startQuiz')}</button>
    </div>
    <div class="quiz-wrap" id="quizWrap"></div>
    <div class="quiz-results" id="quizResults"></div>
  `;
            }

            function attachQuiz(mod) {
                const intro = document.getElementById('quizIntro');
                const wrap = document.getElementById('quizWrap');
                const startBtn = document.getElementById('quizStartBtn');
                startBtn.addEventListener('click', () => {
                    intro.style.display = 'none';
                    wrap.classList.add('active');
                    drawQuestion();
                }
                );

                function drawQuestion() {
                    const q = state.quiz;
                    const item = q.pool[q.idx];
                    const opts = pick(item).o;
                    const answered = q.answers[q.idx];
                    wrap.innerHTML = `
      <div class="quiz-progress"><div class="quiz-progress-bar" style="width:${((q.idx + 1) / q.pool.length) * 100}%"></div></div>
      <div class="quiz-meta"><span>${t('qLabel')} ${q.idx + 1} ${t('of')} ${q.pool.length}</span></div>
      <div class="quiz-q-card">
        <div class="quiz-q-text">${safeFormula(pick(item).q)}</div>
        <div class="quiz-options">
          ${opts.map( (o, oi) => `<button class="opt-btn ${answered === oi ? 'picked-cur' : ''}" style="${answered === oi ? 'border-color:var(--cyan);color:var(--cyan);' : ''}" data-oi="${oi}">${safeFormula(o)}</button>`).join('')}
        </div>
      </div>
      <div class="qn-dots">
        ${q.pool.map( (_, i) => `<div class="qn-dot ${q.answers[i] !== undefined ? 'answered' : ''} ${i === q.idx ? 'current' : ''}" data-goto="${i}">${i + 1}</div>`).join('')}
      </div>
      <div class="quiz-nav">
        <button class="btn btn-ghost" id="qPrev" ${q.idx === 0 ? 'disabled' : ''}>${t('prev')}</button>
        ${q.idx < q.pool.length - 1 ? `<button class="btn btn-primary" id="qNext">${t('next')}</button>` : `<button class="btn btn-primary" id="qSubmit">${t('submitQuiz')}</button>`}
      </div>
      <div class="task-feedback no" id="qWarn" style="margin-top:10px;"></div>
    `;
                    wrap.querySelectorAll('.quiz-options .opt-btn').forEach(b => {
                        b.addEventListener('click', () => {
                            q.answers[q.idx] = Number(b.dataset.oi);
                            drawQuestion();
                        }
                        );
                    }
                    );
                    wrap.querySelectorAll('.qn-dot').forEach(d => {
                        d.addEventListener('click', () => {
                            q.idx = Number(d.dataset.goto);
                            drawQuestion();
                        }
                        );
                    }
                    );
                    const prevBtn = document.getElementById('qPrev');
                    if (prevBtn)
                        prevBtn.addEventListener('click', () => {
                            q.idx = Math.max(0, q.idx - 1);
                            drawQuestion();
                        }
                        );
                    const nextBtn = document.getElementById('qNext');
                    if (nextBtn)
                        nextBtn.addEventListener('click', () => {
                            q.idx = Math.min(q.pool.length - 1, q.idx + 1);
                            drawQuestion();
                        }
                        );
                    const submitBtn = document.getElementById('qSubmit');
                    if (submitBtn)
                        submitBtn.addEventListener('click', () => {
                            if (Object.keys(q.answers).length < q.pool.length) {
                                document.getElementById('qWarn').textContent = t('answerAll');
                                return;
                            }
                            showResults(mod);
                        }
                        );
                }
            }

            function showResults(mod) {
                const wrap = document.getElementById('quizWrap');
                const results = document.getElementById('quizResults');
                wrap.classList.remove('active');
                results.classList.add('active');

                const q = state.quiz;
                let correctCount = 0;
                q.pool.forEach( (item, i) => {
                    if (q.answers[i] === item.c)
                        correctCount++;
                }
                );
                const pct = Math.round((correctCount / q.pool.length) * 100);
                const ringColor = pct >= 70 ? 'var(--green)' : pct >= 40 ? 'var(--cyan)' : 'var(--danger)';
                const qi = Math.floor(Math.random() * QUOTES_EN.length);
                const quote = state.lang === 'ar' ? QUOTES_AR[qi] : QUOTES_EN[qi];

                results.innerHTML = `
    <div class="result-ring" style="border-color:${ringColor};">
      <div class="rr-pct" style="color:${ringColor};">${pct}%</div>
      <div class="rr-lbl">${correctCount}/${q.pool.length}</div>
    </div>
    <div style="font-weight:700;font-size:16px;">${t('yourScore')}</div>
    <div class="result-quote">${quote}</div>
    <div class="task-actions" style="justify-content:center;">
      <button class="btn btn-primary" id="retakeBtn">${t('retake')}</button>
    </div>
    <div class="review-list">
      ${q.pool.map( (item, i) => {
                    const ua = q.answers[i];
                    const opts = pick(item).o;
                    return `<div class="review-item">
          <div class="ri-q">${i + 1}. ${safeFormula(pick(item).q)}</div>
          <div class="ri-a ${ua === item.c ? 'right' : 'wrong'}">${t('yourAnswer')}: ${safeFormula(opts[ua])}</div>
          ${ua !== item.c ? `<div class="ri-a right">${t('correctLbl')}: ${safeFormula(opts[item.c])}</div>` : ''}
        </div>`;
                }
                ).join('')}
    </div>
  `;
                document.getElementById('retakeBtn').addEventListener('click', () => {
                    state.quiz = {
                        module: null,
                        pool: [],
                        idx: 0,
                        answers: {},
                        submitted: false
                    };
                    renderPane(mod);
                }
                );
            }

            /* ============================================================
   CONTENT DATA — grounded in the course lab manual
   ============================================================ */
            function Q(qEn, oEn, qAr, oAr, c) {
                return {
                    en: {
                        q: qEn,
                        o: oEn
                    },
                    ar: {
                        q: qAr,
                        o: oAr
                    },
                    c
                };
            }
            /* True/False shorthand — ans=true means the statement is correct (option index 0) */
            function TF(qEn, qAr, ans) {
                return Q(qEn, ["True", "False"], qAr, ["صح", "خطأ"], ans ? 0 : 1);
            }
            function S(hEn, bodyEn, hAr, bodyAr, formula) {
                return {
                    en: {
                        h: hEn,
                        body: bodyEn
                    },
                    ar: {
                        h: hAr,
                        body: bodyAr
                    },
                    formula: formula || null
                };
            }

            /* ================= EXCEL ================= */
            const EXCEL_SUMMARIES = [S("The IF Function", "Evaluates a logical test and returns one value if it's TRUE and another if it's FALSE. Supported comparison operators are <, >, <=, >=, =.", "دالة IF", "تُقيّم شرطاً منطقياً وتُرجع قيمة عند تحقق الشرط (TRUE) وقيمة أخرى عند عدم تحققه (FALSE). عوامل المقارنة المدعومة هي: <، >، <=، >=، =.", "=IF(condition, value_if_true, value_if_false)"), S("IF with AND", "Combines several conditions and returns the TRUE result only when every single condition is met — if even one fails, the FALSE result is returned.", "دالة IF مع AND", "تجمع بين عدة شروط وتُرجع النتيجة الصحيحة فقط عندما تتحقق كل الشروط معاً — وإذا فشل شرط واحد فقط تُرجع النتيجة البديلة.", "=IF(AND(A1>90, B1>90), \"A1 Grade\", \"Fail\")"), S("IF with OR", "Tests several conditions and returns the TRUE result as soon as at least one of them is met.", "دالة IF مع OR", "تختبر عدة شروط وتُرجع النتيجة الصحيحة بمجرد تحقق شرط واحد على الأقل منها.", "=IF(OR(A2>90, B2>90), \"Pass\", \"Fail\")"), S("IF with NOT", "Reverses a condition's outcome: it returns the TRUE result when the tested condition is actually false.", "دالة IF مع NOT", "تعكس نتيجة الشرط: تُرجع النتيجة الصحيحة عندما يكون الشرط المُختبر في الحقيقة غير متحقق (خاطئاً).", "=IF(NOT(A1=\"Red\"), \"Selected\", \"Rejected\")"), S("Nested IF", "Chains multiple IF functions inside one another to test several ranges of values in sequence and return a different result for each range.", "دالة IF المتداخلة", "تُدمج عدة دوال IF داخل بعضها لاختبار عدة نطاقات من القيم بالتتابع وإرجاع نتيجة مختلفة لكل نطاق.", "=IF(B2>=80,\"1st class\",IF(B2>=70,\"2nd class\",IF(B2>=50,\"3rd class\",\"Fail\")))"), S("VLOOKUP (Vertical Lookup)", "Searches for a value in the first column of a table and returns related data from another column in the same row. The lookup column must be the table's first column.", "دالة VLOOKUP (بحث عمودي)", "تبحث عن قيمة في العمود الأول من جدول وتُرجع بيانات مرتبطة من عمود آخر في نفس الصف. يجب أن يكون عمود البحث هو العمود الأول في الجدول.", "=VLOOKUP(lookup_value, table_array, col_index_num, [range_lookup])"), S("HLOOKUP (Horizontal Lookup)", "Works exactly like VLOOKUP but searches across the first row of a table instead of the first column, returning a value from a specified row below it.", "دالة HLOOKUP (بحث أفقي)", "تعمل تماماً مثل VLOOKUP لكنها تبحث عبر الصف الأول من الجدول بدلاً من العمود الأول، وتُرجع قيمة من صف محدد أسفله.", "=HLOOKUP(lookup_value, table_array, row_index_num, [range_lookup])"), S("MATCH & INDEX", "MATCH returns the relative position of an item within a range. INDEX returns the value at a given row/column position inside a range. Paired together (INDEX + MATCH) they look up a value dynamically without requiring the lookup column to be first — a more flexible alternative to VLOOKUP.", "دالتا MATCH و INDEX", "ترجع MATCH الموضع النسبي لعنصر داخل نطاق. أما INDEX فترجع القيمة الموجودة عند موضع صف/عمود محدد داخل نطاق. عند دمجهما معاً (INDEX + MATCH) يمكن البحث عن قيمة ديناميكياً دون اشتراط أن يكون عمود البحث هو الأول — بديل أكثر مرونة من VLOOKUP.", "=INDEX(B1:B5, MATCH(\"Cherry\", A1:A5, 0))"), S("Data Validation", "Restricts what can be entered into a cell — including dropdown lists built from a defined range — and can show a custom error alert style when the entered value doesn't meet the rule.", "التحقق من صحة البيانات (Data Validation)", "تُقيّد ما يمكن إدخاله في خلية — بما في ذلك القوائم المنسدلة المبنية من نطاق محدد — ويمكنها إظهار نمط تنبيه خطأ مخصص عندما لا تتوافق القيمة المُدخلة مع القاعدة.", null), S("PivotTables & PivotCharts", "A PivotTable is an efficient tool for summarizing, analyzing, and organizing large datasets: it groups, filters, and performs calculations (sums, averages) through a flexible drag-and-drop interface — dragging fields into Rows, Columns, Values and Filters — without writing a single formula. A PivotChart is the visual counterpart, charting that same summarized data, and a pre-designed PivotTable Style can be applied instantly from the Design tab.", "الجداول والمخططات المحورية", "الجدول المحوري أداة فعّالة لتلخيص وتحليل وتنظيم كميات كبيرة من البيانات: فهو يُجمّع ويُصفّي وينفّذ عمليات حسابية (كالمجموع والمتوسط) عبر واجهة سحب وإفلات مرنة — بسحب الحقول إلى مناطق الصفوف (Rows) والأعمدة (Columns) والقيم (Values) والمرشحات (Filters) — دون كتابة أي صيغة على الإطلاق. أما المخطط المحوري فهو النظير البصري، حيث يرسم نفس البيانات المُلخصة بيانياً، ويمكن تطبيق نمط جدول محوري جاهز فوراً من تبويب Design.", null), S("Data Validation — The Three Tabs", "The Data Validation dialog (Data tab) has three tabs working together: Settings defines the rule itself (Whole Number, Date, Text Length, List, or a Custom formula); Input Message (optional) shows a helpful tooltip the moment the cell is selected, explaining what is expected; Error Alert (optional) controls what happens on an invalid entry, with a custom title and message.", "التحقق من صحة البيانات — التبويبات الثلاثة", "يحتوي مربع حوار Data Validation (من تبويب Data) على ثلاثة تبويبات تعمل معاً: تبويب Settings يُحدد القاعدة نفسها (رقم صحيح، تاريخ، طول نص، قائمة، أو صيغة مخصصة)؛ تبويب Input Message (اختياري) يعرض تلميحاً مفيداً بمجرد تحديد الخلية يوضح ما هو متوقع إدخاله؛ وتبويب Error Alert (اختياري) يتحكم فيما يحدث عند إدخال قيمة غير صالحة، بعنوان ورسالة مخصصين.", null), S("Error Alert Styles: Stop / Warning / Information", "Excel offers exactly three error-alert styles once Data Validation rejects an entry. Stop completely blocks the invalid value and forces the user to re-enter. Warning lets the user proceed anyway after confirming. Information simply notifies the user and allows the entry through regardless.", "أنماط تنبيه الخطأ: إيقاف / تحذير / معلومة", "يوفر إكسل ثلاثة أنماط بالضبط لتنبيه الخطأ عندما يرفض التحقق من صحة البيانات قيمة مُدخلة. Stop يمنع القيمة غير الصالحة منعاً تاماً ويُجبر المستخدم على إعادة الإدخال. Warning يسمح للمستخدم بالمتابعة رغم ذلك بعد التأكيد. Information يكتفي بإشعار المستخدم ويسمح بمرور القيمة بغض النظر.", null), S("Protecting a Sheet vs. a Workbook vs. a File", "Three distinct, non-interchangeable protection layers exist. Protect Sheet (via the sheet tab's right-click menu or the Review tab) restricts actions like selecting, formatting or inserting cells, with an optional password. Protect Workbook (Structure) stops users from adding, deleting, hiding, or renaming sheets. Encrypt with Password (File > Info > Protect Workbook) locks the entire file so it cannot even be opened without the password.", "حماية الورقة مقابل المصنف مقابل الملف", "توجد ثلاث طبقات حماية مستقلة وغير قابلة للتبادل. Protect Sheet (من قائمة النقر بزر الفأرة الأيمن على تبويب الورقة أو من تبويب Review) تُقيّد إجراءات مثل تحديد أو تنسيق أو إدراج الخلايا، مع كلمة مرور اختيارية. Protect Workbook (Structure) يمنع المستخدمين من إضافة أو حذف أو إخفاء أو إعادة تسمية الأوراق. Encrypt with Password (من File > Info > Protect Workbook) يُقفل الملف بأكمله بحيث لا يمكن فتحه إطلاقاً دون كلمة المرور.", null), S("Building a PivotTable — The Workflow", "After selecting the source data range, Insert > PivotTable creates a new report where fields from the source table are dragged into four zones: Rows (categories down the side), Columns (categories across the top), Values (the numbers being summarized — sum, average, count…), and Filters (a top-level slicer for the whole report).", "بناء جدول محوري — سير العمل", "بعد تحديد نطاق بيانات المصدر، يُنشئ Insert > PivotTable تقريراً جديداً تُسحب فيه الحقول من الجدول المصدر إلى أربع مناطق: Rows (فئات أسفل الجانب)، Columns (فئات عبر الأعلى)، Values (الأرقام التي يتم تلخيصها — مجموع، متوسط، عدد...)، وFilters (مرشّح عام على مستوى التقرير بأكمله).", null), ];
