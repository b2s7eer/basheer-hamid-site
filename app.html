            const WORD_SUMMARIES = [S("Styles", "A style bundles many formatting commands (font, size, spacing, color) into one named set, applied from the Styles gallery, the Styles pane, or the Apply Styles task pane — keeping a long document visually consistent.", "الأنماط (Styles)", "يجمع النمط عدة أوامر تنسيق (الخط، الحجم، التباعد، اللون) في مجموعة واحدة بمسمى محدد، ويُطبّق من معرض الأنماط أو جزء الأنماط أو جزء مهام تطبيق الأنماط — مما يحافظ على اتساق المستند الطويل بصرياً.", null), S("Creating a New Style", "A style can be created from an already-formatted paragraph (becomes part of that document only) or built from the ground up in the Styles pane so it can be saved into a template for future documents.", "إنشاء نمط جديد", "يمكن إنشاء نمط من فقرة مُنسّقة مسبقاً (يصبح جزءاً من ذلك المستند فقط) أو بناؤه من الصفر عبر جزء الأنماط بحيث يمكن حفظه ضمن قالب لاستخدامه في مستندات مستقبلية.", null), S("Templates (.dotx)", "A template is a pre-formatted starting point with predefined layouts, fonts, colors and placeholders. Save one via File > Save As, choosing Word Template (*.dotx) as the file type.", "القوالب (.dotx)", "القالب هو نقطة انطلاق مُنسّقة مسبقاً تحتوي على تخطيطات وخطوط وألوان وعناصر نائبة محددة سلفاً. يُحفظ عبر File > Save As باختيار نوع الملف Word Template (*.dotx).", null), S("Sections & Breaks", "Layout > Breaks > Next Page (or Continuous) starts an independent section, allowing different margins, orientation, and header/footer content per section — enabled by turning off \"Link to Previous\".", "الأقسام وفواصل الأقسام", "يبدأ الأمر Layout > Breaks > Next Page (أو Continuous) قسماً مستقلاً، مما يسمح بهوامش واتجاه صفحة ومحتوى ترويسة/تذييل مختلف لكل قسم — ويُفعَّل ذلك بإيقاف خيار \"Link to Previous\".", null), S("Page Numbering per Section", "Insert > Page Number > Format Page Numbers lets you choose a numbering style (e.g., Roman numerals for an introduction, Arabic numerals for chapters) and set where numbering starts.", "ترقيم الصفحات لكل قسم", "يتيح لك Insert > Page Number > Format Page Numbers اختيار نمط ترقيم (كالأرقام الرومانية للمقدمة والعربية للفصول) وتحديد بداية الترقيم.", null), S("Automated Table of Contents", "Found under the References tab, it builds itself from headings formatted with the Styles tool. It can be Updated (page numbers only, or the entire table) or removed entirely.", "جدول المحتويات الآلي", "يوجد تحت تبويب References، ويُبنى تلقائياً من العناوين المُنسقة بأداة الأنماط. يمكن تحديثه (أرقام الصفحات فقط، أو الجدول بالكامل) أو حذفه بالكامل.", null), S("Mail Merge", "Combines a main document (like a letter template) with a recipient list to create personalized copies. Managed from the Mailings tab: Select Recipients, build the address list, then insert merge fields.", "الدمج البريدي (Mail Merge)", "يدمج مستنداً رئيسياً (كقالب خطاب) مع قائمة مستلمين لإنتاج نسخ مُخصصة لكل شخص. يُدار من تبويب Mailings: Select Recipients، ثم بناء قائمة العناوين، ثم إدراج حقول الدمج.", null), S("Citations & Bibliography", "References to sources (books, articles) inserted from the References tab. Choose a citation style, add sources via Add New Source or manage them via Manage Sources, then generate the Bibliography automatically.", "الاستشهادات والمراجع (Bibliography)", "إشارات إلى المصادر (كتب، مقالات) تُدرج من تبويب References. اختر نمط استشهاد، أضف المصادر عبر Add New Source أو أدرها عبر Manage Sources، ثم أنشئ قائمة المراجع تلقائياً.", null), S("Creating and Managing an Index", "An index is a list of important terms with their page numbers, usually placed at a document's end. Entries are marked with References > Index group > Mark Entry (Alt+Shift+X) — each entry can carry a Main entry, a Subentry (e.g. \"Chart Types\" under \"Data Analysis\"), and a Cross-reference (\"See also Graphs\"). Mark places one instance; Mark All tags every occurrence. The index itself is inserted afterward via References > Insert Index, with a choice of Indented or Run-in layout and a chosen number of columns. Because it is dynamic, right-click the index and Update Field whenever page numbers or content shift — or press Ctrl+A then F9 to refresh every field in the document at once.", "إنشاء وإدارة الفهرس (Index)", "الفهرس قائمة بأهم المصطلحات مع أرقام صفحاتها، توضع عادة في نهاية المستند. تُعلَّم الإدخالات عبر References > Index group > Mark Entry (أو Alt+Shift+X) — ويمكن لكل إدخال أن يحمل إدخالاً رئيسياً (Main entry)، وإدخالاً فرعياً (Subentry) مثل \"أنواع المخططات\" تحت \"تحليل البيانات\"، ومرجعاً تبادلياً (Cross-reference) مثل \"انظر أيضاً الرسوم البيانية\". يُعلّم Mark نسخة واحدة، بينما يُعلّم Mark All كل تكرار للمصطلح. يُدرج الفهرس نفسه لاحقاً عبر References > Insert Index، مع اختيار تخطيط Indented أو Run-in وعدد أعمدة محدد. ولأنه ديناميكي، انقر بزر الفأرة الأيمن على الفهرس واختر Update Field كلما تغيّرت أرقام الصفحات أو المحتوى — أو اضغط Ctrl+A ثم F9 لتحديث كل الحقول في المستند دفعة واحدة.", null), S("Essential Word Keyboard Shortcuts", "<table style=\"width:100%;border-collapse:collapse;margin-top:6px;font-size:12.5px;\" dir=\"ltr\"><tbody>" + "<tr><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--muted);\">Normal style</td><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--cyan);font-family:var(--font-mono);text-align:right;\">Ctrl+Shift+N</td></tr>" + "<tr><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--muted);\">Heading 1 / 2 / 3</td><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--cyan);font-family:var(--font-mono);text-align:right;\">Ctrl+Alt+1 / 2 / 3</td></tr>" + "<tr><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--muted);\">Jump to next higher heading</td><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--cyan);font-family:var(--font-mono);text-align:right;\">Alt+Shift+←</td></tr>" + "<tr><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--muted);\">Jump to next lower heading</td><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--cyan);font-family:var(--font-mono);text-align:right;\">Alt+Shift+→</td></tr>" + "<tr><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--muted);\">Mark Index Entry</td><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--cyan);font-family:var(--font-mono);text-align:right;\">Alt+Shift+X</td></tr>" + "<tr><td style=\"padding:6px 8px;color:var(--muted);\">Update all fields (incl. Index / TOC)</td><td style=\"padding:6px 8px;color:var(--cyan);font-family:var(--font-mono);text-align:right;\">Ctrl+A, then F9</td></tr>" + "</tbody></table>", "اختصارات لوحة المفاتيح الأساسية في وورد", "<table style=\"width:100%;border-collapse:collapse;margin-top:6px;font-size:12.5px;\"><tbody>" + "<tr><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--muted);\">النمط العادي (Normal)</td><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--cyan);font-family:var(--font-mono);\" dir=\"ltr\">Ctrl+Shift+N</td></tr>" + "<tr><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--muted);\">عنوان ١ / ٢ / ٣</td><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--cyan);font-family:var(--font-mono);\" dir=\"ltr\">Ctrl+Alt+1 / 2 / 3</td></tr>" + "<tr><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--muted);\">الانتقال للعنوان الأعلى التالي</td><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--cyan);font-family:var(--font-mono);\" dir=\"ltr\">Alt+Shift+←</td></tr>" + "<tr><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--muted);\">الانتقال للعنوان الأدنى التالي</td><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--cyan);font-family:var(--font-mono);\" dir=\"ltr\">Alt+Shift+→</td></tr>"             const WORD_QUESTIONS = [Q("Applying a style to a paragraph does what, in one action?", ["Changes only the font color", "Applies many formatting commands simultaneously", "Deletes the paragraph", "Inserts a page break"], "تطبيق نمط على فقرة يفعل ماذا، في إجراء واحد؟", ["يغيّر لون الخط فقط", "يطبّق عدة أوامر تنسيق في آن واحد", "يحذف الفقرة", "يُدرج فاصل صفحة"], 1), Q("Where can a style be applied from?", ["The Styles gallery on the Home tab only", "The Styles gallery, the Styles pane, or the Apply Styles task pane", "Only the Insert tab", "The Print Preview screen"], "من أين يمكن تطبيق نمط؟", ["معرض الأنماط في تبويب Home فقط", "معرض الأنماط، أو جزء الأنماط، أو جزء مهام تطبيق الأنماط", "تبويب Insert فقط", "شاشة معاينة الطباعة"], 1), Q("A style created directly from a formatted paragraph becomes:", ["Part of every future document automatically", "Part of the current document only, not the template", "Deleted after saving", "Locked and uneditable"], "النمط المُنشأ مباشرة من فقرة مُنسّقة يصبح:", ["جزءاً من كل مستند مستقبلي تلقائياً", "جزءاً من المستند الحالي فقط، دون القالب", "محذوفاً بعد الحفظ", "مقفلاً وغير قابل للتعديل"], 1), Q("To make a new style available in future documents, you should:", ["Only apply it to one paragraph", "Build it from the ground up and save it as part of a template", "Print the document", "Disable AutoCorrect"], "لجعل نمط جديد متاحاً في المستندات المستقبلية، يجب:", ["تطبيقه على فقرة واحدة فقط", "بناؤه من الصفر وحفظه كجزء من قالب", "طباعة المستند", "تعطيل التصحيح التلقائي"], 1), Q("A Word template file typically uses which extension?", [".docx", ".dotx", ".pdf", ".ttf"], "غالباً ما يستخدم ملف قالب وورد الامتداد:", [".docx", ".dotx", ".pdf", ".ttf"], 1), Q("To save a document as a reusable template, you use:", ["File > Print", "File > Save As, choosing Word Template (*.dotx)", "Insert > Template", "Review > New Comment"], "لحفظ مستند كقالب قابل لإعادة الاستخدام، تستخدم:", ["File > Print", "File > Save As، مع اختيار Word Template (*.dotx)", "Insert > Template", "Review > New Comment"], 1), Q("Custom personal templates can be opened again from:", ["File > Open > Personal", "Insert > Shapes", "View > Outline", "Home > Find"], "يمكن فتح القوالب الشخصية المخصصة مرة أخرى من:", ["File > Open > Personal", "Insert > Shapes", "View > Outline", "Home > Find"], 0), Q("Section breaks are inserted from which tab?", ["Home", "Layout", "References", "Review"], "تُدرج فواصل الأقسام من أي تبويب؟", ["Home", "Layout", "References", "Review"], 1), Q("A Next Page section break:", ["Starts the new section on the same page", "Starts the new section on a new page", "Deletes the previous section", "Only works in tables"], "فاصل قسم Next Page:", ["يبدأ القسم الجديد في نفس الصفحة", "يبدأ القسم الجديد في صفحة جديدة", "يحذف القسم السابق", "يعمل فقط داخل الجداول"], 1), Q("A Continuous section break:", ["Starts the new section on the same page", "Always forces a landscape page", "Removes all headers", "Can only be used once per document"], "فاصل قسم Continuous:", ["يبدأ القسم الجديد في نفس الصفحة", "يفرض دائماً صفحة عرضية", "يحذف جميع الترويسات", "يمكن استخدامه مرة واحدة فقط في المستند"], 0), Q("To give one section its own unique header, you must first:", ["Delete the header entirely", "Deselect \"Link to Previous\" in the Header & Footer tab", "Change the font size", "Insert a table"], "لإعطاء قسم ما ترويسة خاصة به، يجب أولاً:", ["حذف الترويسة بالكامل", "إلغاء تحديد \"Link to Previous\" في تبويب Header & Footer", "تغيير حجم الخط", "إدراج جدول"], 1), Q("Format Page Numbers is used to:", ["Change font style only", "Choose a numbering style and set where a section's numbering starts", "Merge two documents", "Insert images"], "يُستخدم Format Page Numbers لـ:", ["تغيير نمط الخط فقط", "اختيار نمط ترقيم وتحديد بداية ترقيم القسم", "دمج مستندين", "إدراج صور"], 1), Q("A common use of different numbering styles per section is:", ["Roman numerals for the introduction, Arabic numerals for chapters", "Only using letters throughout", "Disabling numbering entirely", "Numbering images instead of pages"], "من الاستخدامات الشائعة لأنماط الترقيم المختلفة لكل قسم:", ["أرقام رومانية للمقدمة، وأرقام عربية للفصول", "استخدام الحروف فقط طوال المستند", "تعطيل الترقيم بالكامل", "ترقيم الصور بدلاً من الصفحات"], 0), Q("An automated Table of Contents is generated from:", ["Bold text anywhere in the document", "Headings formatted with the Styles tool", "Manually typed page numbers", "Comments in the margin"], "يُنشأ جدول المحتويات الآلي من:", ["أي نص عريض في المستند", "العناوين المُنسّقة بأداة الأنماط", "أرقام صفحات مكتوبة يدوياً", "التعليقات في الهامش"], 1), Q("The Table of Contents tool is located on which tab?", ["Home", "Insert", "References", "Mailings"], "توجد أداة جدول المحتويات في أي تبويب؟", ["Home", "Insert", "References", "Mailings"], 2), Q("\"Update page numbers only\" versus \"Update entire table\" differ in that the second option also:", ["Deletes the table", "Refreshes the heading text itself, not just page numbers", "Changes the document theme", "Only works once"], "يختلف \"Update page numbers only\" عن \"Update entire table\" في أن الخيار الثاني أيضاً:", ["يحذف الجدول", "يُحدّث نص العناوين نفسه، وليس أرقام الصفحات فقط", "يغيّر سمة المستند", "يعمل مرة واحدة فقط"], 1), Q("To remove a Table of Contents entirely, you:", ["Press Delete on the whole page", "Use References > Table of Contents > Remove Table of Contents", "Undo ten times", "Rename the document"], "لحذف جدول المحتويات بالكامل، تقوم بـ:", ["الضغط على Delete للصفحة بأكملها", "استخدام References > Table of Contents > Remove Table of Contents", "التراجع عشر مرات", "إعادة تسمية المستند"], 1), Q("Mail Merge is primarily used to:", ["Create personalized copies of a document for a list of recipients", "Merge two Excel files", "Compress a Word file", "Translate a document"], "يُستخدم الدمج البريدي بشكل أساسي لـ:", ["إنشاء نسخ مُخصصة من مستند لقائمة من المستلمين", "دمج ملفي إكسل", "ضغط ملف وورد", "ترجمة مستند"], 0), Q("Mail Merge is managed primarily from which tab?", ["Mailings", "View", "Design", "Draw"], "يُدار الدمج البريدي بشكل أساسي من أي تبويب؟", ["Mailings", "View", "Design", "Draw"], 0), Q("To create a brand-new recipient list for a mail merge, you choose:", ["Use an Existing List only", "Select Recipients > Type New List", "Insert > Table", "Design > Themes"], "لإنشاء قائمة مستلمين جديدة تماماً لدمج بريدي، تختار:", ["استخدام قائمة موجودة فقط", "Select Recipients > Type New List", "Insert > Table", "Design > Themes"], 1), Q("Merge fields inserted into the main document act as:", ["Static text that never changes", "Placeholders that are replaced with each recipient's data", "Images", "Page breaks"], "تعمل حقول الدمج المُدرجة في المستند الرئيسي كـ:", ["نص ثابت لا يتغير أبداً", "عناصر نائبة تُستبدل ببيانات كل مستلم", "صور", "فواصل صفحات"], 1), Q("To finally produce the personalized letters after setting up fields, you click:", ["Finish & Merge", "Print Preview", "Save As", "Spelling & Grammar"], "لإنتاج الخطابات المُخصصة أخيراً بعد إعداد الحقول، تنقر:", ["Finish & Merge", "Print Preview", "Save As", "Spelling & Grammar"], 0), Q("A citation in Word is:", ["A footnote formatting style", "A reference to a source such as a book or article", "A type of table", "A slide transition"], "الاستشهاد في وورد هو:", ["نمط تنسيق حاشية سفلية", "إشارة إلى مصدر مثل كتاب أو مقال", "نوع من الجداول", "انتقال شرائح"], 1), Q("Where do you choose a citation style (e.g., APA, MLA)?", ["Home > Font", "References > Style dropdown in Citations & Bibliography", "Insert > Symbol", "View > Ruler"], "أين تختار نمط الاستشهاد (مثل APA أو MLA)؟", ["Home > Font", "قائمة Style المنسدلة في References داخل مجموعة Citations & Bibliography", "Insert > Symbol", "View > Ruler"], 1), Q("To add a brand-new source for a citation, you use:", ["Citation > Add New Source", "Insert > New Source", "Design > Sources", "File > New Source"], "لإضافة مصدر جديد تماماً للاستشهاد، تستخدم:", ["Citation > Add New Source", "Insert > New Source", "Design > Sources", "File > New Source"], 0), Q("Manage Sources, found under References, lets you:", ["Only delete the document", "View and organize every source used or available for citing", "Change the page orientation", "Resize images"], "يتيح لك Manage Sources الموجود تحت References:", ["حذف المستند فقط", "عرض وتنظيم جميع المصادر المُستخدمة أو المتاحة للاستشهاد بها", "تغيير اتجاه الصفحة", "تغيير حجم الصور"], 1), Q("A Bibliography (or Works Cited list) is generated from:", ["References > Bibliography", "Home > Paragraph", "Insert > Header", "View > Draft"], "تُنشأ قائمة المراجع (Bibliography) من:", ["References > Bibliography", "Home > Paragraph", "Insert > Header", "View > Draft"], 0), Q("An advantage of using Word's citation tool instead of typing references manually is:", ["It's the only way to add bold text", "The bibliography can be generated and updated automatically as sources are added", "It removes the need for a References tab", "It automatically translates the sources"], "من مزايا استخدام أداة الاستشهاد في وورد بدلاً من كتابة المراجع يدوياً:", ["أنها الطريقة الوحيدة لإضافة نص عريض", "يمكن إنشاء قائمة المراجع وتحديثها تلقائياً مع إضافة المصادر", "تُلغي الحاجة إلى تبويب References", "تُترجم المصادر تلقائياً"], 1), Q("Navigating headings quickly with Alt+Shift+→ moves you to:", ["The next lower heading level", "The previous document", "A blank page", "The print dialog"], "التنقل السريع بين العناوين باستخدام Alt+Shift+→ ينقلك إلى:", ["مستوى العنوان الأدنى التالي", "المستند السابق", "صفحة فارغة", "نافذة الطباعة"], 0), Q("Which best describes the relationship between Styles and a Table of Contents?", ["They are unrelated features", "The Table of Contents is built from headings that use Styles", "Styles can only be used after the Table of Contents exists", "Table of Contents replaces the need for Styles"], "أي وصف يمثّل العلاقة بين الأنماط وجدول المحتويات بأفضل شكل؟", ["ميزتان غير مرتبطتين", "يُبنى جدول المحتويات من العناوين التي تستخدم الأنماط", "لا يمكن استخدام الأنماط إلا بعد و اً فريداً.", true), TF("A Table of Contents can only be built manually; Word cannot generate one automatically.", "لا يمكن بناء جدول المحتويات إلا يدوياً؛ ولا يستطيع وورد إنشاءه تلقائياً.", false), TF("\"Update entire table\" refreshes the heading text itself, not just the page numbers.", "يُحدّث \"Update entire table\" نص العناوين نفسه، وليس أرقام الصفحات فقط.", true), TF("Mail Merge can only be used for printed letters, never for personalized emails.", "لا يمكن استخدام الدمج البريدي إلا للخطابات المطبوعة، ولا يمكن استخدامه أبداً للرسائل الإلكترونية المُخصصة.", false), TF("A citation's style (APA, MLA, etc.) can be changed from the References tab's Style dropdown.", "يمكن تغيير نمط الاستشهاد (APA، MLA، إلخ) من القائمة المنسدلة Style في تبويب References.", true), TF("An index entry can include a cross-reference pointing to a related term instead of a page number.", "يمكن أن يتضمن إدخال الفهرس مرجعاً تبادلياً يشير إلى مصطلح ذي صلة بدلاً من رقم صفحة.", true), ];

            /* ================= POWERPOINT ================= */
            const PPT_SUMMARIES = [S("The PowerPoint Interface", "The Ribbon holds task tabs (Home, Insert, Design, Transitions, Animations, Slide Show, Review, View). The Slides pane lists slides; the Slide window shows the current one; the Notes pane holds speaker notes the audience never sees.", "واجهة بوربوينت", "يحتوي الشريط (Ribbon) على تبويبات المهام (Home، Insert، Design، Transitions، Animations، Slide Show، Review، View). يعرض جزء الشرائح القائمة؛ ونافذة الشريحة تُظهر الشريحة الحالية؛ وجزء الملاحظات يحتوي ملاحظات المتحدث التي لا يراها الجمهور أبداً.", null), S("Slide Layouts", "Layouts like Title Slide, Title and Content, Section Header, and Two Content define what placeholders a slide starts with — chosen from the layout gallery next to New Slide on the Home tab.", "تخطيطات الشرائح", "تُحدد التخطيطات مثل Title Slide وTitle and Content وSection Header وTwo Content العناصر النائبة التي تبدأ بها الشريحة — تُختار من معرض التخطيطات بجانب New Slide في تبويب Home.", null), S("Transitions", "Effects applied on the Transitions tab that play when moving between two slides. Duration and Effect Options can be customized, and Apply to All makes the setting consistent across the whole deck.", "الانتقالات (Transitions)", "تأثيرات تُطبّق من تبويب Transitions تظهر عند الانتقال بين شريحتين. يمكن تخصيص المدة (Duration) وخيارات التأثير (Effect Options)، ويجعل الخيار Apply to All الإعداد موحداً عبر العرض بأكمله.", null), S("Transition Timing", "On Mouse Click advances manually; After (Time) advances automatically once a set number of seconds passes — both are configured in the Timing group of the Transitions tab.", "توقيت الانتقالات", "يُقدّم On Mouse Click الشريحة يدوياً؛ بينما يُقدّمها After (Time) تلقائياً بعد مرور عدد محدد من الثواني — يُضبط كلاهما في مجموعة Timing بتبويب Transitions.", null), S("Animations & Triggers", "Animations (entrance, emphasis, exit, motion path) are set on the Animations tab and managed in the Animation Pane. A Trigger makes an animation start only when a specific object is clicked, instead of automatically.", "الحركات والمُفعّلات (Triggers)", "تُضبط الحركات (دخول، تأكيد، خروج، مسار حركة) من تبويب Animations وتُدار عبر جزء Animation Pane. يجعل المُفعّل (Trigger) الحركة تبدأ فقط عند النقر على عنصر معيّن بدلاً من بدئها تلقائياً.", null), S("Animation Painter", "Copies a fully-configured animation from one object to another, the same way Format Painter copies text formatting — saving you from rebuilding the same effect repeatedly.", "أداة نسخ الحركة (Animation Painter)", "تنسخ حركة مُعدّة بالكامل من عنصر إلى آخر، بنفس طريقة عمل Format Painter مع تنسيق النص — فتوفر عليك إعادة بناء نفس التأثير مراراً.", null), S("Slide Master", "Built from the layouts used in a presentation, it lets you set a theme, font combination, color palette, and effects once from the top-level theme slide, and have every layout inherit it — unifying the whole deck instantly.", "الشريحة الرئيسية (Slide Master)", "تُبنى من التخطيطات المستخدمة في العرض، وتتيح لك ضبط السمة وتركيبة الخطوط ولوحة الألوان والتأثيرات مرة واحدة من شريحة السمة العلوية، بحيث يرثها كل تخطيط — موحّدة العرض بأكمله فوراً.", null), S("Media & Screen Recording", "Video and audio can be inserted directly into a slide from the Insert tab; PowerPoint also includes a built-in Screen Recording tool to capture on-screen actions straight into a slide.", "الوسائط وتسجيل الشاشة", "يمكن إدراج الفيديو والصوت مباشرة داخل الشريحة من تبويب Insert؛ ويضم بوربوينت أيضاً أداة تسجيل شاشة مدمجة لالتقاط ما يجري على الشاشة مباشرة داخل شريحة.", null), S("Microsoft 365 Collaboration", "Microsoft 365 pairs the desktop apps with cloud services — OneDrive for storage, Teams for communication, SharePoint for document management — enabling real-time co-authoring and file sharing via a generated link or email invite.", "التعاون عبر مايكروسوفت 365", "يقرن مايكروسوفت 365 تطبيقات سطح المكتب بخدمات سحابية — OneDrive للتخزين، وTeams للتواصل، وSharePoint لإدارة المستندات — مما يتيح التأليف المشترك الفوري ومشاركة الملفات عبر رابط أو دعوة بالبريد الإلكتروني.", null), S("AI Tools in Presentations", "Tools like Microsoft Copilot and Gamma AI generate an outline, text, and images from a topic prompt and a chosen theme; most allow further editing through text commands and export to PowerPoint, PDF, or Google Slides.", "أدوات الذكاء الاصطناعي في العروض", "تولّد أدوات مثل Microsoft Copilot وGamma AI مخططاً ونصاً وصوراً من فكرة موضوع وسمة مُختارة؛ وتتيح معظمها تعديلاً إضافياً عبر أوامر نصية والتصدير إلى بوربوينت أو PDF أو Google Slides.", null), S("PowerPoint Keyboard Shortcuts", "<table style=\"width:100%;border-collapse:collapse;margin-top:6px;font-size:12.5px;\" dir=\"ltr\"><tbody>" + "<tr><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--muted);\">New presentation</td><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--cyan);font-family:var(--font-mono);text-align:right;\">Ctrl+N</td></tr>" + "<tr><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--muted);\">New slide</td><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--cyan);font-family:var(--font-mono);text-align:right;\">Ctrl+M</td></tr>" + "<tr><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--muted);\">Save</td><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--cyan);font-family:var(--font-mono);text-align:right;\">Ctrl+S</td></tr>" + "<tr><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--muted);\">Pause / resume screen recording</td><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--cyan);font-family:var(--font-mono);text-align:right;\">Win+Shift+R</td></tr>" + "<tr><td style=\"padding:6px 8px;color:var(--muted);\">Stop screen recording</td><td style=\"padding:6px 8px;color:var(--cyan);font-family:var(--font-mono);text-align:right;\">Win+Shift+Q</td></tr>" + "</tbody></table>", "اختصارات لوحة المفاتيح في بوربوينت", "<table style=\"width:100%;border-collapse:collapse;margin-top:6px;font-size:12.5px;\"><tbody>" + "<tr><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--muted);\">عرض تقديمي جديد</td><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--cyan);font-family:var(--font-mono);\" dir=\"ltr\">Ctrl+N</td></tr>" + "<tr><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--muted);\">شريحة جديدة</td><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--cyan);font-family:var(--font-mono);\" dir=\"ltr\">Ctrl+M</td></tr>" + "<tr><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--muted);\">حفظ</td><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--cyan);font-family:var(--font-mono);\" dir=\"ltr\">Ctrl+S</td></tr>" + "<tr><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--muted);\">إيقاف/استئناف تسجيل الشاشة مؤقتاً</td><td style=\"padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--cyan);font-family:var(--font-mono);\" dir=\"ltr\">Win+Shift+R</td></tr>" + "<tr><td style=\"padding:6px 8px;color:var(--muted);\">إيقاف تسجيل الشاشة نهائياً</td><td style=\"padding:6px 8px;color:var(--cyan);font-family:var(--font-mono);\" dir=\"ltr\">Win+Shift+Q</td></tr>" + "</tbody></table>", null), S("Saving a Screen Recording as Media", "After capturing a screen recording, right-click the recording object on the slide and choose Save as Media, then pick a destination drive/folder and file name — this exports the capture as a standalone video file separate from the .pptx.", "حفظ تسجيل الشاشة كملف وسائط", "بعد التقاط تسجيل الشاشة، انقر بزر الفأرة الأيمن على كائن التسجيل في الشريحة واختر Save as Media، ثم حدد محرك الأقراص/المجلد الوجهة واسم الملف — يُصدّر هذا التسجيل كملف فيديو مستقل منفصل عن ملف .pptx.", null), ];

            const PPT_QUESTIONS = [Q("Which Ribbon tab contains Save, Undo, Repeat, and Start From Beginning?", ["The Ribbon tabs themselves", "The Quick Access Toolbar", "The Notes pane", "The Status bar"], "أي عنصر يحتوي على أوامر Save وUndo وRepeat وStart From Beginning؟", ["تبويبات الشريط نفسها", "شريط أدوات الوصول السريع (Quick Access Toolbar)", "جزء الملاحظات", "شريط الحالة"], 1), Q("The Notes pane in Normal view is used for:", ["Content the audience sees on screen", "Speaker notes the audience cannot see", "Slide transitions", "Animation settings"], "يُستخدم جزء الملاحظات في العرض العادي (Normal view) لـ:", ["محتوى يراه الجمهور على الشاشة", "ملاحظات المتحدث التي لا يراها الجمهور", "انتقالات الشرائح", "إعدادات الحركة"], 1), Q("Which view lets you rearrange slides for better flow?", ["Reading View", "Slide Sorter View", "Notes Page", "Outline only"], "أي عرض يتيح لك إعادة ترتيب الشرائح لتحسين التسلسل؟", ["Reading View", "Slide Sorter View", "Notes Page", "العرض التخطيطي فقط"], 1), Q("A new slide can be added quickly with the shortcut:", ["Ctrl+N", "Ctrl+M", "Ctrl+S", "Ctrl+P"], "يمكن إضافة شريحة جديدة بسرعة باستخدام اختصار:", ["Ctrl+N", "Ctrl+M", "Ctrl+S", "Ctrl+P"], 1), Q("A Title Slide layout typically contains:", ["Only an image placeholder", "A title and a subtitle", "Two content columns", "A video placeholder only"], "يحتوي تخطيط شريحة العنوان (Title Slide) عادة على:", ["عنصر نائب لصورة فقط", "عنوان وعنوان فرعي", "عمودي محتوى", "عنصر نائب لفيديو فقط"], 1), Q("The Section Header layout is mainly used to:", ["Divide a presentation into parts", "Insert a chart", "Show two images side by side", "Add a video"], "يُستخدم تخطيط عنوان القسم (Section Header) بشكل أساسي لـ:", ["تقسيم العرض التقديمي إلى أجزاء", "إدراج مخطط بياني", "عرض صورتين جنباً إلى جنب", "إضافة فيديو"], 0), Q("Slide layouts are chosen from:", ["The layout gallery next to New Slide on the Home tab", "The Review tab", "The View tab only", "The File menu"], "تُختار تخطيطات الشرائح من:", ["معرض التخط             const GLOSSARY = [G("IF Function", "Excel's core logical function: it evaluates a single condition using a comparison operator (<, >, <=, >=, =) and branches into exactly one of two outcomes — the value_if_true argument when the test holds, the value_if_false argument when it doesn't. Every more advanced logical formula (AND, OR, NOT, Nested IF) is ultimately built around this same three-argument shape.", "دالة IF", "الدالة المنطقية الأساسية في إكسل: تُقيّم شرطاً واحداً باستخدام عامل مقارنة (<، >، <=، >=، =) وتتفرّع إلى واحدة فقط من نتيجتين — الوسيطة value_if_true عند تحقق الاختبار، والوسيطة value_if_false عند عدم تحققه. تُبنى كل صيغة منطقية أكثر تقدماً (AND، OR، NOT، IF المتداخلة) في النهاية حول نفس هذا الشكل ثلاثي الوسائط."), G("AND Function", "A combining function, never used alone: it wraps several individual conditions and returns TRUE only when every single one of them holds simultaneously. Nested inside an IF — =IF(AND(cond1,cond2),...) — it enforces an \"all requirements must pass\" rule, such as a student needing to clear two separate subjects to earn a top grade.", "دالة AND", "دالة دمج لا تُستخدم بمفردها أبداً: تُغلّف عدة شروط منفردة وتُرجع TRUE فقط عندما تتحقق كل الشروط في آن واحد. عند تداخلها داخل IF — =IF(AND(cond1,cond2),...) — تفرض قاعدة \"يجب اجتياز كل المتطلبات\"، كطالب يحتاج لاجتياز مادتين منفصلتين معاً للحصول على أعلى تقدير."), G("OR Function", "A combining function that returns TRUE the moment at least one of its listed conditions is true — the opposite bar from AND. Paired with IF — =IF(OR(cond1,cond2),...) — it enforces an \"any one requirement is enough\" rule. Caution: OR treats any non-numeric text as a non-zero value, so it can evaluate to TRUE unexpectedly on text cells.", "دالة OR", "دالة دمج تُرجع TRUE بمجرد تحقق شرط واحد على الأقل من الشروط المدرجة فيها — عكس معيار AND تماماً. عند اقترانها بـ IF — =IF(OR(cond1,cond2),...) — تفرض قاعدة \"يكفي تحقق أي متطلب واحد\". تنبيه: تتعامل OR مع أي نص غير رقمي كقيمة غير صفرية، لذا قد تُ
